services:

  postgres-auth:
    image: postgres:16
    container_name: saas_postgres_auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_auth
      POSTGRES_USER: saas_auth_user
      POSTGRES_PASSWORD: Auth@12345
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_auth_user -d saas_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-tenant:
    image: postgres:16
    container_name: saas_postgres_tenant
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_tenant
      POSTGRES_USER: saas_tenant_user
      POSTGRES_PASSWORD: Tenant@12345
    ports:
      - "5437:5432"
    volumes:
      - postgres_tenant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_tenant_user -d saas_tenant"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-core:
    image: postgres:16
    container_name: saas_postgres_core
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_core
      POSTGRES_USER: saas_core_user
      POSTGRES_PASSWORD: Core@12345
    ports:
      - "5438:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_core_user -d saas_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16
    container_name: saas_postgres_notification
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_notification
      POSTGRES_USER: saas_notification_user
      POSTGRES_PASSWORD: Notification@12345
    ports:
      - "5439:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_notification_user -d saas_notification"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-billing:
    image: postgres:16
    container_name: saas_postgres_billing
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_billing
      POSTGRES_USER: saas_billing_user
      POSTGRES_PASSWORD: Billing@12345
    ports:
      - "5440:5432"
    volumes:
      - postgres_billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_billing_user -d saas_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: ./services/auth-service
    container_name: saas_celery
    command: opentelemetry-instrument celery -A config worker --loglevel=info --events
    working_dir: /app
    volumes:
      - ./services/auth-service:/app
    env_file:
      - ./services/auth-service/.env.docker
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  flower:
    build:
      context: ./infrastructure/flower
      dockerfile: Dockerfile
    container_name: saas_flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: ${FLOWER_BROKER_URL:-redis://redis:6379/5}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?Set FLOWER_BASIC_AUTH in the root .env file}
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
    container_name: saas_auth_service
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./services/auth-service:/app
    env_file:
      - ./services/auth-service/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy

  tenant-service:
    build:
      context: ./services/tenant-service
    container_name: saas_tenant_service
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./services/tenant-service:/app
    env_file:
      - ./services/tenant-service/.env.docker
    ports:
      - "8001:8000"
    depends_on:
      postgres-tenant:
        condition: service_healthy
      redis:
        condition: service_healthy

  core-service:
    build:
      context: ./services/core-service
    container_name: saas_core_service
    command: opentelemetry-instrument python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./services/core-service:/app
    env_file:
      - ./services/core-service/.env.docker
    ports:
      - "8002:8000"
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
    container_name: saas_notification_service
    command: opentelemetry-instrument celery -A config worker --loglevel=info --events
    working_dir: /app
    volumes:
      - ./services/notification-service:/app
    env_file:
      - ./services/notification-service/.env.docker
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy

  billing-service:
    build:
      context: ./services/billing-service
    container_name: saas_billing_service
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./services/billing-service:/app
    env_file:
      - ./services/billing-service/.env.docker
    ports:
      - "8004:8000"
    depends_on:
      redis:
        condition: service_healthy

  celery-core:
    build:
      context: ./services/core-service
    container_name: saas_celery_core
    command: opentelemetry-instrument celery -A config worker --loglevel=info --events
    working_dir: /app
    volumes:
      - ./services/core-service:/app
    env_file:
      - ./services/core-service/.env.docker
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  celery-notification:
    build:
      context: ./services/notification-service
    container_name: saas_celery_notification
    command: opentelemetry-instrument celery -A config worker --loglevel=info --events
    working_dir: /app
    volumes:
      - ./services/notification-service:/app
    env_file:
      - ./services/notification-service/.env.docker
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  celery-billing:
    build:
      context: ./services/billing-service
    container_name: saas_celery_billing
    command: opentelemetry-instrument celery -A config worker --loglevel=info --events
    working_dir: /app
    volumes:
      - ./services/billing-service:/app
    env_file:
      - ./services/billing-service/.env.docker
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

    celery-tenant:
      build:
        context: ./services/tenant-service
      container_name: saas_celery_tenant
      restart: unless-stopped
      command: >
        opentelemetry-instrument celery -A config worker
        --loglevel=info
        --events
        --queues=tenant-outbox
        --hostname=tenant-outbox@%h
      working_dir: /app
      volumes:
        - ./services/tenant-service:/app
      env_file:
        - ./services/tenant-service/.env.docker
      depends_on:
        postgres-tenant:
          condition: service_healthy
        redis:
          condition: service_healthy
        kafka:
          condition: service_healthy
        jaeger:
          condition: service_started

  celery-beat-tenant:
    build:
      context: ./services/tenant-service
    container_name: saas_celery_beat_tenant
    restart: unless-stopped
    command: >
      opentelemetry-instrument celery -A config beat
      --loglevel=info
    working_dir: /app
    volumes:
      - ./services/tenant-service:/app
    env_file:
      - ./services/tenant-service/.env.docker
    depends_on:
      redis:
        condition: service_healthy
      celery-tenant:
        condition: service_started
      jaeger:
        condition: service_started

  core-event-consumer:
    build:
      context: ./services/core-service
    container_name: saas_core_event_consumer
    command: >
      opentelemetry-instrument
      python manage.py run_event_consumer
    working_dir: /app
    env_file:
      - ./services/core-service/.env.docker
    volumes:
      - ./services/core-service:/app
    depends_on:
      postgres-core:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped
  
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: saas_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"
      - "4318"

  
  kafka:
    image: apache/kafka:4.1.1
    container_name: saas_kafka
    restart: unless-stopped

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "127.0.0.1:9092:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  notification-consumer:
    build:
      context: ./services/notification-service
    container_name: saas_notification_consumer
    restart: unless-stopped
    command: python manage.py consume_events
    env_file:
      - ./services/notification-service/.env.docker
    depends_on:
      kafka:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
    networks:
      - saas_network

  pgbouncer:
    build:
      context: ./infrastructure/pgbouncer
      dockerfile: Dockerfile

    container_name: saas_pgbouncer

    restart: unless-stopped

    ports:
      - "6432:6432"

    env_file:
      - .env.docker

    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-tenant:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
      postgres-billing:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -h 127.0.0.1 -p 6432"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_auth_data:
  postgres_tenant_data:
  postgres_core_data:
  postgres_notification_data:
  postgres_billing_data:
  redis_data:
  flower_data:
  kafka_data: