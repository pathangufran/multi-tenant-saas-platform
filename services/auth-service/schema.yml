openapi: 3.0.3
info:
  title: SaaS Platform Authentication API
  version: 1.0.0
  description: Authentication APIs for the Multi-Tenant SaaS Platform.
paths:
  /api/v1/auth/email-verification/send/:
    post:
      operationId: v1_auth_email_verification_send_create
      tags:
      - Email Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationSend'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationSend'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationSend'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
        '429':
          description: No response body
  /api/v1/auth/email-verification/verify/:
    post:
      operationId: v1_auth_email_verification_verify_create
      tags:
      - Email Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '409':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '429':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '401':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: v1_auth_password_change_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '429':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
          description: ''
        '200':
          description: No response body
        '400':
          description: No response body
        '500':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
components:
  schemas:
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - last_name
    EmailVerificationResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    EmailVerificationSend:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    EmailVerificationVerify:
      type: object
      properties:
        token:
          type: string
          format: uuid
      required:
      - token
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
      required:
      - access_token
      - refresh_token
      - token_type
    Logout:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
      required:
      - refresh_token
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
    PasswordChangeResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    TokenRefresh:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
      required:
      - refresh_token
    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
      required:
      - access_token
      - refresh_token
      - token_type
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
      required:
      - email
      - password
    UserRegistrationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
